name: Deploy to VPS

on:
  push:
    branches:
      - master
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          password: ${{ secrets.VPS_PASSWORD }} # Dành cho xác thực bằng mật khẩu
          # key: ${{ secrets.VPS_SSH_KEY }} # Nếu sau này bạn đổi sang dùng Key thì bỏ dấu # ở dòng này đi
          envs: MYSQL_ROOT_PASSWORD,JWT_SECRET,GITHUB_TOKEN
          # port: ${{ secrets.VPS_PORT }} # nếu không dùng cổng 22

          script: |
            # Khởi tạo đường dẫn tuyệt đối vào thư mục cá nhân của người dùng
            DEPLOY_DIR="$HOME/url-shortener"

            # Kiểm tra xem thư mục đã tồn tại chưa
            if [ ! -d "$DEPLOY_DIR" ]; then
              echo "🔄 Thư mục chưa tồn tại. Đang tự động Clone mã nguồn lần đầu..."
              mkdir -p "$DEPLOY_DIR"
              git clone https://oauth2:$GITHUB_TOKEN@github.com/${{ github.repository }}.git "$DEPLOY_DIR"
              cd "$DEPLOY_DIR"
            else
              cd "$DEPLOY_DIR"
              echo "🔄 Đang cập nhật mã nguồn..."
              git fetch --all
              git checkout master
              git reset --hard origin/master
              git clean -fd
            fi

            if [ ! -f .env ]; then
              echo "📄 Tạo file .env mới..."
              echo "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD" > .env
              echo "JWT_SECRET=$JWT_SECRET" >> .env
              echo "APP_URL=https://linknip.click" >> .env
              echo "CORS_ORIGIN=https://linknip.click" >> .env
            else
              echo "✅ .env đã tồn tại, giữ nguyên."
            fi

            echo "🏗️ Build và khởi động container..."
            docker compose -f docker-compose.prod.yml up -d --build

            echo "🗄️ Chạy migration Prisma..."
            docker compose -f docker-compose.prod.yml exec -T url-shortener-backend npx prisma migrate deploy

            echo "🧹 Dọn dẹp image cũ..."
            docker image prune -f

            echo "✅ Deploy hoàn tất!"